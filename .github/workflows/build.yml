name: build

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      nixpkgs_rev:
        description: "nixpkgs revision (blank = lock / daily update)"
        required: false
      jovian_rev:
        description: "Jovian-NixOS revision (blank = lock / daily update)"
        required: false
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, .github/workflows/build.yml]

permissions:
  contents: write # commit the updated flake.lock

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # The runner ships with ~14 GB free; mesa, steam and their build
      # inputs need more headroom than that.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            max-jobs = auto

      # Also adds the cache as a substituter, so anything already pushed is
      # fetched rather than rebuilt, and pushes every path built afterwards.
      - uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE || secrets.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nixpkgs_rev == '' && inputs.jovian_rev == '')
        run: nix flake update

      - name: Build
        env:
          NIXPKGS_REV: ${{ inputs.nixpkgs_rev }}
          JOVIAN_REV: ${{ inputs.jovian_rev }}
        run: |
          args=()
          [ -n "$NIXPKGS_REV" ] && args+=(--override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS_REV")
          [ -n "$JOVIAN_REV" ]  && args+=(--override-input jovian-nixos "github:Jovian-Experiments/Jovian-NixOS/$JOVIAN_REV")
          nix flake metadata "${args[@]}"
          # --keep-going: one broken package should not stop the rest from
          # being built and cached.
          nix build .#default --keep-going --print-build-logs --no-link "${args[@]}"

      - name: Commit flake.lock
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nixpkgs_rev == '' && inputs.jovian_rev == '')
        run: |
          git diff --quiet flake.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "flake.lock: update" flake.lock
          git push
